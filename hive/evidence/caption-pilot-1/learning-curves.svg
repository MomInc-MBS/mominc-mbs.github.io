<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" role="img" aria-labelledby="title desc"><title id="title">Caption pilot accuracy by source group</title><desc id="desc">Twelve synthetic source groups. Groups 0–7 development, 8–11 held-out. Rules, combined and candidate score 100%; probe-only 33.3%. Same-template groups limit uncertainty estimates. This is not a learning-speed curve.</desc><rect width="820" height="400" fill="#faf7fc"/><g font-family="sans-serif" fill="#29143f"><text x="60" y="30" font-size="20">Observed accuracy by source group</text><rect x="545" y="55" width="215" height="235" fill="#f1e7c8"/><text x="550" y="75" font-size="13">Exposed held-out fixtures</text><path d="M60 285H760" stroke="#d8ccdf"/><text x="12" y="290" font-size="13">0%</text><path d="M60 185.0H760" stroke="#d8ccdf"/><text x="12" y="190.0" font-size="13">50%</text><path d="M60 85H760" stroke="#d8ccdf"/><text x="12" y="90" font-size="13">100%</text><polyline points="70,85 132,85 194,85 256,85 318,85 380,85 442,85 504,85 566,85 628,85 690,85 752,85" fill="none" stroke="#4b236d" stroke-width="3" stroke-dasharray=""/><text x="60" y="345" font-size="14" fill="#4b236d">rules</text><polyline points="70,218.33333333333334 132,218.33333333333334 194,218.33333333333334 256,218.33333333333334 318,218.33333333333334 380,218.33333333333334 442,218.33333333333334 504,218.33333333333334 566,218.33333333333334 628,218.33333333333334 690,218.33333333333334 752,218.33333333333334" fill="none" stroke="#9a751c" stroke-width="3" stroke-dasharray="8 4"/><text x="245" y="345" font-size="14" fill="#9a751c">probe</text><polyline points="70,85 132,85 194,85 256,85 318,85 380,85 442,85 504,85 566,85 628,85 690,85 752,85" fill="none" stroke="#895aae" stroke-width="3" stroke-dasharray="2 5"/><text x="430" y="345" font-size="14" fill="#895aae">combined</text><polyline points="70,85 132,85 194,85 256,85 318,85 380,85 442,85 504,85 566,85 628,85 690,85 752,85" fill="none" stroke="#c14866" stroke-width="3" stroke-dasharray="14 6"/><text x="615" y="345" font-size="14" fill="#c14866">probe-guard</text><text x="64" y="310" font-size="12">0</text><text x="126" y="310" font-size="12">1</text><text x="188" y="310" font-size="12">2</text><text x="250" y="310" font-size="12">3</text><text x="312" y="310" font-size="12">4</text><text x="374" y="310" font-size="12">5</text><text x="436" y="310" font-size="12">6</text><text x="498" y="310" font-size="12">7</text><text x="560" y="310" font-size="12">8</text><text x="622" y="310" font-size="12">9</text><text x="684" y="310" font-size="12">10</text><text x="746" y="310" font-size="12">11</text><text x="60" y="375" font-size="12">Overlapping 100% traces. Cluster intervals collapse here; real-world uncertainty remains unmeasured.</text></g></svg>
