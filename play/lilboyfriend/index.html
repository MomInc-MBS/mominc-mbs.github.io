<!doctype html>
<html lang="en" data-game="lilboyfriend">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#271936" />
    <title>Little Boyfriend · Museum of Living Small</title>
    <link rel="canonical" href="https://mominc.online/play/lilboyfriend/" />
    <link rel="stylesheet" href="./style.css?objects=12" />
  <script src="../../tv/touch-controls.js"></script>
    <script src="../../tv/mbs-channels.js"></script>
    <script src="../../tv/state.js"></script>
    <script src="../../tv/mbs-shim.js"></script>
</head>
  <body>
    <main id="experience">
      <canvas
        id="world"
        aria-label="First person felt and clay museum"
      ></canvas>
      <a id="exit" href="../../games/lilboyfriend/" aria-label="Back to the TV"
        ><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg
      ></a>
      <section id="intro">
        <button id="start" aria-label="Enter the museum">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
        </button>
      </section>
      <section
        id="hologram"
        class="hologram"
        hidden
        aria-label="Magnifier hologram"
      >
        <span id="holo-count" hidden></span>
        <h2 id="holo-title"></h2>
        <p id="holo-body"></p>
        <a id="holo-source" target="_blank" rel="noopener"></a>
        <div class="advert"><p id="holo-ad"></p></div>
      </section>
      <section id="ending" hidden>
        <p id="ending-copy"></p>
        <button id="restart" aria-label="Try again">&#8635;</button>
      </section>
      <div id="caption" class="sr-only" role="status" aria-live="polite"></div>
      <div id="prompt" aria-live="polite"></div>
      <nav id="controls" hidden aria-label="Museum controls">
        <button id="back" aria-label="Walk backwards">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v15M5 12l7 8 7-8" /></svg></button
        ><button id="forward" aria-label="Walk forward">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V5M5 12l7-8 7 8" /></svg>
        </button>
      </nav>
      <div id="error" hidden role="alert"></div>
    </main>
    <script type="module" src="./boot.js?objects=12"></script>
  </body>
</html>
