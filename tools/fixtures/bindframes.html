<!doctype html>
<html lang="en" data-game="fixture" data-mode="public" data-api="">
<head>
<meta charset="utf-8">
<title>bindFrames fixture</title>
<meta name="robots" content="noindex">
<style>
  html,body{margin:0;height:100%;background:#111}
  #channel{width:320px;height:320px}
  #fxGame{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<!-- The non-GOON stand-in for check_contract.py's in-frame GAME_START case (PLAN-r9 3.G0).
     GOON's game was the site's only same-origin <iframe>, so closing its route retired the sole
     coverage of MBS.bindFrames(). This page is that shape and nothing more: the REAL mbs-shim.js,
     a real #channel, and a real same-origin iframe appended into it exactly where mount.js appends
     a fragment - then MBS.bindFrames(), which is mount.js:95's call, verbatim in intent.

     ?bind=0 skips that call. That half must NOT see GAME_START, and it is the half that carries the
     argument: without it, a passing "bound" case proves only that a click somewhere produced an
     event, not that the event crossed a document boundary that nothing else can cross. The shim's
     own listener is on #channel, one document up, so if the unbound half ever starts passing, the
     fixture has stopped testing bindFrames and says so.

     Uses the shipped scripts in the same order the generated play routes use them (mbs-channels.js
     before state.js before mbs-shim.js): the shim reads window.MBS_CHANNELS at load and calls
     paint() -> MBS_STATE at the end of its IIFE, so a fixture that stubbed either would be testing
     a stub. -->
<div id="channel" class="channel"></div>

<script src="../../tv/mbs-channels.js"></script>
<script src="../../tv/state.js"></script>
<script src="../../tv/mbs-shim.js"></script>
<script>
  var bind = new URLSearchParams(location.search).get("bind") !== "0";
  var f = document.createElement("iframe");
  f.id = "fxGame";
  f.title = "fixture frame";
  f.src = "frame-inner.html";
  document.getElementById("channel").appendChild(f);
  // mount.js:95, after the fragment lands. Called while the frame is still about:blank on purpose:
  // that is when mount.js calls it too, so bindFrames' load-listener branch is the one under test.
  if (bind) window.MBS.bindFrames();
  document.documentElement.dataset.fxBound = bind ? "1" : "0";
</script>
</body>
</html>
